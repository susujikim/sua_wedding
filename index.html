<!DOCTYPE html>
<html lang="ko">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>이준석 ♥ 김수지 결혼식 초대</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;600&display=swap" rel="stylesheet">

<style>

body{
margin:0;
font-family:'Noto Sans KR', sans-serif;
background:#ffffff;
color:#222;
line-height:1.7;
}

/* 상단 */

.hero{
position:relative;
height:420px;
background:url("main.jpg") center/cover;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
color:white;
}

.hero-overlay{
position:absolute;
inset:0;
background:rgba(0,0,0,0.25);
}

.hero-text{
position:relative;
z-index:2;
}

.hero h1{
font-size:32px;
letter-spacing:3px;
}

.hero p{
margin-top:10px;
font-size:15px;
}

/* 섹션 */

.section{
padding:60px 20px;
max-width:800px;
margin:auto;
text-align:center;
}

.section-title{
font-size:18px;
margin-bottom:30px;
letter-spacing:2px;
}

/* 초대 문구 */

.invite-main{
font-size:28px;
font-weight:600;
margin-bottom:20px;
line-height:1.5;
}

.invite-sub{
font-size:15px;
color:#444;
}

/* 디데이 */

.dday{
font-size:30px;
font-weight:600;
margin-bottom:25px;
}

/* 달력 */

.calendar{
max-width:320px;
margin:auto;
}

.calendar-title{
font-weight:600;
margin-bottom:10px;
}

.calendar-grid{
display:grid;
grid-template-columns:repeat(7,1fr);
gap:5px;
}

.day-name{
font-size:12px;
color:#888;
}

.day{
padding:8px 0;
border:1px solid #eee;
border-radius:4px;
font-size:13px;
}

.wedding-day{
background:#333;
color:white;
font-weight:600;
}

/* 사진 */

.gallery{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:8px;
}

.gallery img{
width:100%;
aspect-ratio:1/1;
object-fit:cover;
cursor:pointer;
}

@media(max-width:768px){

.gallery{
grid-template-columns:repeat(2,1fr);
}

}

/* 지도 */

.map iframe{
width:100%;
height:320px;
border:none;
}

/* 계좌 */

.account{
background:#f8f8f8;
padding:20px;
margin-top:10px;
border-radius:8px;
}

button{
margin-top:8px;
padding:10px 14px;
background:#333;
color:white;
border:none;
border-radius:6px;
cursor:pointer;
}

/* 스크롤 애니메이션 */

.fade{
opacity:0;
transform:translateY(30px);
transition:0.7s;
}

.fade.show{
opacity:1;
transform:translateY(0);
}

/* 사진 팝업 */

.modal{
position:fixed;
inset:0;
background:rgba(0,0,0,0.85);
display:none;
align-items:center;
justify-content:center;
}

.modal.show{
display:flex;
}

.modal img{
max-width:90%;
max-height:80%;
}

.close{
position:absolute;
top:20px;
right:30px;
font-size:30px;
color:white;
cursor:pointer;
}

</style>

</head>

<body>

<!-- 메인 사진 -->

<div class="hero">

<div class="hero-overlay"></div>

<div class="hero-text">

<h1>이준석 ♥ 김수지</h1>
<p>2026년 8월 1일 토요일 오후 2시</p>

</div>

</div>

<!-- 초대 문구 -->

<div class="section fade">

<div class="invite-main">

연애 종료<br>
부부 시작

</div>

<div class="invite-sub">

저희 두 사람이 이제 부부로서<br>
새로운 출발을 하려 합니다.<br><br>

소중한 분들을 모시고<br>
그 시작을 함께하고자 합니다.<br><br>

부디 오셔서 따뜻한 축복으로<br>
함께해 주세요.

</div>

</div>

<!-- 디데이 + 달력 -->

<div class="section fade">

<div class="section-title">결혼식까지</div>

<div id="dday" class="dday"></div>

<div class="calendar">

<div class="calendar-title">2026년 8월</div>

<div class="calendar-grid">

<div class="day-name">일</div>
<div class="day-name">월</div>
<div class="day-name">화</div>
<div class="day-name">수</div>
<div class="day-name">목</div>
<div class="day-name">금</div>
<div class="day-name">토</div>

<div></div>
<div></div>
<div></div>
<div></div>
<div></div>

<div class="day wedding-day">1</div>
<div class="day">2</div>

</div>

</div>

</div>

<!-- 사진 -->

<div class="section fade">

<div class="section-title">사진</div>

<div class="gallery">

<img src="img1.jpg">
<img src="img2.jpg">
<img src="img3.jpg">
<img src="img4.jpg">
<img src="img5.jpg">
<img src="img6.jpg">
<img src="img7.jpg">
<img src="img8.jpg">
<img src="img9.jpg">
<img src="img10.jpg">
<img src="img11.jpg">
<img src="img12.jpg">

</div>

</div>

<!-- 지도 -->

<div class="section fade">

<div class="section-title">오시는 길</div>

<div class="map">

<iframe src="https://maps.google.com/maps?q=seoul&t=&z=13&ie=UTF8&iwloc=&output=embed"></iframe>

</div>

<p style="margin-top:10px">
서울시 ○○구 ○○로 00 ○○웨딩홀
</p>

</div>

<!-- 계좌 -->

<div class="section fade">

<div class="section-title">마음 전하실 곳</div>

<div class="account">

<p>신랑 이준석</p>
<p>국민은행 123-456-789012</p>

<button onclick="copy('123456789012')">계좌번호 복사</button>

</div>

<br>

<div class="account">

<p>신부 김수지</p>
<p>신한은행 110-123-456789</p>

<button onclick="copy('110123456789')">계좌번호 복사</button>

</div>

</div>

<div class="modal" id="modal">

<span class="close" onclick="closeModal()">×</span>

<img id="modalImg">

</div>

<script>

/* 사진 팝업 */

const images=document.querySelectorAll(".gallery img");
const modal=document.getElementById("modal");
const modalImg=document.getElementById("modalImg");

images.forEach(img=>{
img.onclick=()=>{
modal.classList.add("show");
modalImg.src=img.src;
};
});

function closeModal(){
modal.classList.remove("show");
}

/* 디데이 */

const wedding=new Date("2026-08-01T14:00:00");
const today=new Date();

const diff=Math.ceil((wedding-today)/(1000*60*60*24));

document.getElementById("dday").innerText="D-"+diff;

/* 계좌 복사 */

function copy(text){
navigator.clipboard.writeText(text);
alert("계좌번호가 복사되었습니다.");
}

/* 스크롤 애니메이션 */

const observer=new IntersectionObserver(entries=>{
entries.forEach(entry=>{
if(entry.isIntersecting){
entry.target.classList.add("show");
}
});
});

document.querySelectorAll(".fade").forEach(el=>{
observer.observe(el);
});

</script>

</body>
</html>
